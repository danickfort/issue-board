<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Issue Board · capture studio</title>
<link rel="stylesheet" href="/xterm.css">
<style>
@font-face{font-family:CaptureMono;src:url('/font.ttf')}
@font-face{font-family:CaptureSymbols;src:url('/symbols.ttf')}
*{box-sizing:border-box}body{margin:0;background:#10131e;color:#cad3f5;font:16px system-ui,sans-serif;padding:26px 32px;height:100vh;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center;margin:0 4px 20px}h1{font-size:23px;letter-spacing:-.5px;margin:0;color:#f4f5fa}header span{font-size:13px;color:#8bd5ca;letter-spacing:1px;text-transform:uppercase}.window{border:1px solid #363c52;border-radius:12px;background:#181926;overflow:hidden;box-shadow:0 20px 65px #0005}.bar{height:38px;border-bottom:1px solid #363c52;display:flex;align-items:center;gap:7px;padding:0 16px;background:#202334}.dot{height:9px;width:9px;border-radius:50%;background:#ed8796}.dot:nth-child(2){background:#eed49f}.dot:nth-child(3){background:#a6da95}.bar b{font-size:12px;font-weight:500;color:#939ab7;margin:auto}#terminal{padding:12px 14px;height:calc(100vh - 182px)}footer{display:flex;justify-content:space-between;align-items:center;height:48px;padding:0 4px}#chapter{color:#f4f5fa;font-weight:600;font-size:15px}#hint{color:#a5adcb;font-size:13px}.xterm-viewport{scrollbar-width:none}button{font:inherit;color:#8bd5ca;background:none;border:0;cursor:pointer}button:disabled{color:#6e738d}#controls{display:flex;gap:12px}.recording #controls{display:none}
</style>
<style>
#input-hud{display:flex;align-items:center;gap:9px;height:38px;max-width:650px;font-family:CaptureMono,monospace}#input-hud:empty{visibility:hidden}.input-label{font-size:10px;color:#939ab7;letter-spacing:1px}.input-event{text-transform:none;display:flex;align-items:center;gap:5px;opacity:.36}.input-event:last-child{opacity:1}kbd{display:inline-block;background:#29354b;border:1px solid #62748c;border-bottom:3px solid #62748c;border-radius:6px;padding:5px 10px;font:600 16px CaptureMono,monospace;color:#eef5ff;white-space:nowrap}.input-event:last-child kbd{background:#224b49;border-color:#8bd5ca;color:#c5fff3}.click-ring{position:fixed;z-index:20;pointer-events:none;width:44px;height:44px;border:3px solid #8bd5ca;border-radius:50%;background:#8bd5ca22;transform:translate(-50%,-50%);box-shadow:0 0 0 7px #8bd5ca18;animation:click-pulse 1.4s ease-out forwards}#capture-pointer{position:fixed;z-index:21;pointer-events:none;width:16px;height:16px;background:#f4f5fa;border:2px solid #10131e;border-radius:50%;transform:translate(-50%,-50%);display:none;box-shadow:0 1px 5px #0009}@keyframes click-pulse{0%{opacity:1;scale:.7}70%{opacity:1}100%{opacity:0;scale:1.4}}
</style>
<header><h1>Issue Board</h1><div id="input-hud" aria-label="Recent keyboard and mouse inputs" aria-live="polite"></div><span>Keyboard driven. In your terminal.</span></header>
<div class="window"><div class="bar"><i class="dot"></i><i class="dot"></i><i class="dot"></i><b>fish · xterm.js · offline demo</b></div><div id="terminal"></div></div>
<footer><div><span id="chapter">Ready to explore</span><span id="hint"> &nbsp; YouTrack · GitLab · Jira</span></div><div id="controls"><button id="tour">Run walkthrough</button><button id="fast-tour">Faster tour + keys</button></div></footer>
<div id="capture-pointer"></div>
<script src="/xterm.js"></script><script src="/fit.js"></script><script src="/webgl.js"></script><script type="module" src="/client.js"></script>
</html>
