[project]
name = "issueboard"
version = "0.3.3"
description = "A keyboard-driven terminal issue board for YouTrack, GitLab and Jira Cloud"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["textual>=1.0,<9", "httpx>=0.28,<1", "keyring>=25,<26"]

[project.scripts]
issueboard = "issueboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "pyyaml>=6,<7",
]
release = [
    "pyinstaller==6.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# issueboard is the sole command; tracker-specific options are subcommands.
[tool.hatch.build.targets.wheel]
include = ["issueboard", "youtrack_board", "gitlab_board", "jira_board"]

[tool.hatch.build.targets.sdist]
include = ["issueboard", "youtrack_board", "gitlab_board", "jira_board", "pyproject.toml", "README.md", "LICENSE"]

[project.urls]
Homepage = "https://github.com/danickfort/issue-board"
Repository = "https://github.com/danickfort/issue-board"
