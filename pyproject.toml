[project]
name = "issueboard"
version = "0.2.1"
description = "A keyboard-driven terminal issue board for YouTrack and GitLab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["textual>=1.0,<9", "httpx>=0.28,<1", "keyring>=25,<26"]

[project.scripts]
issueboard = "issueboard.app:main"
youtrack-board = "youtrack_board.app:main"
gitlab-board = "gitlab_board.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# issueboard opens either board; youtrack-board and gitlab-board remain for existing scripts and habits.
[tool.hatch.build.targets.wheel]
include = ["issueboard", "youtrack_board", "gitlab_board"]

[tool.hatch.build.targets.sdist]
include = ["issueboard", "youtrack_board", "gitlab_board", "pyproject.toml", "README.md", "LICENSE"]

[project.urls]
Homepage = "https://github.com/krabilousse/issue-board"
Repository = "https://github.com/krabilousse/issue-board"
