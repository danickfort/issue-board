name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/build_release.py'
      - 'scripts/prepare_winget.py'
      - 'issueboard/**'
      - 'youtrack_board/**'
      - 'gitlab_board/**'
      - 'jira_board/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.1'
          python-version: '3.12'
      - name: Install locked dependencies
        run: uv sync --locked --group release
      - name: Validate tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          uv run python -c 'import os, tomllib; v = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]; assert os.environ["RELEASE_TAG"] == "v" + v, "Tag must match pyproject.toml version"'
      - name: Test
        run: uv run pytest -q
      - name: Build native packages and smoke test commands
        run: uv run python scripts/build_release.py
      - name: Build Python distributions
        if: runner.os == 'Linux'
        run: |
          uv build --out-dir dist/release
          cd dist/release
          for asset in *.whl issueboard-*.tar.gz; do
            sha256sum "$asset" > "$asset.sha256"
          done
      - name: Generate WinGet manifests from the Windows archive
        if: runner.os == 'Windows'
        run: uv run python scripts/prepare_winget.py dist/release/issueboard-*-windows-x86_64.zip
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: winget-manifests
          path: dist/winget/manifests
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Create draft, upload assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes
          gh release upload "$RELEASE_TAG" release/*
          gh release edit "$RELEASE_TAG" --draft=false
