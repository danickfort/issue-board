version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      uv-minor-and-patch:
        update-types: [minor, patch]
      uv-major:
        update-types: [major]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Zurich
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
